<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제어시스템</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: rgb(205, 186, 218);
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .card {
            background-color: rgb(197, 133, 216);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2{
            text-align:center;
            margin-bottom: 20px;
            color: #333;
        }
        .control-btn { 
            display: block;
            width: 100%;
            padding: 18px;
            margin-bottom: 12px;
            border: none;

            font-size: 16px;
            color: white;
            background-color: #007BFF;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: background-color 0.2s ease;
        }
        .off {
            background-color: #7f8c8d;
        }
        .on {
            background-color: #27ae60;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="card">
            <h2>장치 개발 제어 (3개)</h2>

            <button id="btn1" class="control-btn off" onclick="toggleButton(this)">1번장치 가동</button>
            <button id="btn2" class="control-btn off" onclick="toggleButton(this)">2번장치 가동</button>
            <button id="btn3" class="control-btn off" onclick="toggleButton(this)">3번장치 가동</button>
            <button id="btn4" class="control-btn off" onclick="toggleButton(this)">4번장치 가동</button>
        </div>
    </div>

    <script>
        function toggleButton(element) {
            if (element.classList.contains('off')) {
                element.classList.remove('off');
                element.classList.add('on');
                element.innerText = element.id.replace('btn', '') + '번장치 가동 중';

                console.log(element.id + ' 번 켜짐 (on)');
            } else {
                element.classList.remove('on');
                element.classList.add('off');
                element.innerText = element.id.replace('btn', '') + '번 장치 가동';

                console.log(element.id + ' 번 꺼짐 (off)');
            }
            
        }
    </script>
</body>
</html>
